<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talaba-agent</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2033;--mute:#6b7189;--line:#e4e7f0;--brand:#4f46e5;--brand2:#7c3aed;--ok:#16a34a;--err:#dc2626;--r:16px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:999px;color:var(--mute);text-decoration:none;font-weight:600;font-size:14px;cursor:pointer}
nav a.on{background:#eef0ff;color:var(--brand)}
.sp{flex:1}
.pill{background:#eef0ff;color:var(--brand);padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:6px 0 4px}h2{font-size:19px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.narrow{max-width:460px;margin:20px auto}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #c7c9ff;border-color:var(--brand)}
textarea{min-height:90px;resize:vertical}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.light{background:#eef0ff;color:var(--brand)}
.btn.red{background:#fee2e2;color:var(--err)}
.btn.sm{padding:6px 12px;font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.msg{margin-top:12px;font-size:14px;font-weight:600}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.hint{font-size:13px;margin-top:6px}.hint.err{color:var(--err)}.hint.ok{color:var(--ok)}
.show{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;margin-top:8px;cursor:pointer}.show input{width:auto}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-weight:700;cursor:pointer;color:var(--mute)}
.tabs button.on{background:#eef0ff;border-color:#c7c9ff;color:var(--brand)}
/* Pinterest uslubidagi ideyalar */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:14px;color:var(--mute)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.masonry{columns:4 230px;column-gap:14px}
.idea{break-inside:avoid;margin-bottom:14px;border-radius:var(--r);padding:18px;color:#fff;position:relative;transition:transform .15s}
.idea:hover{transform:translateY(-3px)}
.idea .em{font-size:30px}.idea .cat{font-size:12px;opacity:.85;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.idea h3{margin:4px 0 6px;font-size:17px;line-height:1.3}.idea p{margin:0 0 12px;font-size:14px;opacity:.95}
.idea .acts{display:flex;gap:8px}
.idea button{border:0;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;background:rgba(255,255,255,.92);color:#1c2033}
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.svc button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;cursor:pointer;font:inherit}
.svc button.on{border-color:var(--brand);background:#f5f5ff}
.svc b{display:block}.svc small{color:var(--mute)}
.svc .pr{color:var(--brand);font-weight:800;font-size:14px}
.result{margin-top:18px}
pre.prompt{white-space:pre-wrap;word-wrap:break-word;background:#0f172a;color:#e2e8f0;padding:16px;border-radius:12px;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;max-height:420px;overflow:auto}
.steps{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;margin-top:12px;font-size:14px}
.steps a{color:var(--brand);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.pick{cursor:pointer}.pick:hover{background:#f5f5ff}.pick.sel{background:#eef0ff}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px;background:#fff}
summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header><div class="bar">
  <span class="logo" id="logo">🎓 Talaba-agent</span>
  <nav id="nav"></nav>
  <span class="sp"></span>
  <span id="who"></span>
</div></header>
<main id="app"></main>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let me = null, cfg = { services: [], telegram: '' }, ideasCache = [];
let draft = { service: 'referat', topic: '', pages: 10, lang: 'uz', notes: '' };

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
async function api(url, body) {
  const r = await fetch(url, { method: body ? 'POST' : 'GET', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(d.error || 'Xatolik yuz berdi'); e.status = r.status; e.data = d; throw e; }
  return d;
}
const som = n => Number(n).toLocaleString('ru-RU').replace(/ /g, ' ') + ' so\'m';
const dt = t => new Date(t).toLocaleString('uz-UZ', { dateStyle: 'short', timeStyle: 'short' });
const go = p => { location.hash = p; };

function renderHeader() {
  const nav = $('#nav'); nav.replaceChildren();
  const items = [['ideas', '💡 Ideyalar'], ['prompt', '✨ Prompt yaratish'], ['balance', '💳 Hisobim']];
  if (me && me.role === 'admin') items.push(['admin', '🛠️ Admin']);
  const cur = (location.hash || '#ideas').slice(1);
  items.forEach(([k, t]) => nav.append(h('a', { class: cur === k ? 'on' : '', onclick: () => go(k) }, t)));
  const who = $('#who'); who.replaceChildren();
  if (me) {
    who.append(h('span', { class: 'pill' }, me.role === 'admin' ? 'Admin' : som(me.balance)), ' ',
      h('button', { class: 'btn light sm', onclick: async () => { await api('/api/logout', {}); me = null; go('auth'); route(); } }, 'Chiqish'));
  } else who.append(h('button', { class: 'btn sm', onclick: () => go('auth') }, 'Kirish'));
}

function passField(id, ph) {
  const inp = h('input', { id, type: 'password', placeholder: ph, autocomplete: id === 'rpass' ? 'new-password' : 'current-password' });
  const cb = h('input', { type: 'checkbox', onchange: () => { inp.type = cb.checked ? 'text' : 'password'; } });
  return [inp, h('label', { class: 'show' }, cb, 'Parolni ko\'rsatish')];
}

/* ---------- Kirish / Ro'yxatdan o'tish ---------- */
function viewAuth() {
  let mode = 'login';
  const box = h('div', { class: 'card narrow' });
  const draw = () => {
    box.replaceChildren();
    box.append(h('div', { class: 'tabs' },
      h('button', { class: mode === 'login' ? 'on' : '', onclick: () => { mode = 'login'; draw(); } }, 'Tizimga kirish'),
      h('button', { class: mode === 'reg' ? 'on' : '', onclick: () => { mode = 'reg'; draw(); } }, 'Ro\'yxatdan o\'tish')));
    const msg = h('div', { class: 'msg' });
    const fail = t => { msg.className = 'msg err'; msg.textContent = t; };
    if (mode === 'login') {
      const [p, sh] = passField('lpass', 'Parol');
      const u = h('input', { id: 'luser', placeholder: 'Username', autocomplete: 'username', autocapitalize: 'none' });
      const submit = async () => {
        try { const d = await api('/api/login', { username: u.value, password: p.value }); me = d.user; go(me.role === 'admin' ? 'admin' : 'prompt'); route(); }
        catch (e) { fail(e.message); }
      };
      p.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      box.append(h('label', {}, 'Username'), u, h('label', {}, 'Parol'), p, sh, h('div', { style: 'margin-top:16px' }, h('button', { class: 'btn', onclick: submit }, 'Kirish')), msg);
    } else {
      const fn = h('input', { placeholder: 'Ism', autocomplete: 'given-name' });
      const ln = h('input', { placeholder: 'Familya', autocomplete: 'family-name' });
      const un = h('input', { placeholder: 'masalan: ali_2005', autocomplete: 'username', autocapitalize: 'none' });
      const hint = h('div', { class: 'hint' });
      const [p, sh] = passField('rpass', 'Kamida 6 ta belgi');
      let timer;
      un.addEventListener('input', () => {
        clearTimeout(timer);
        const v = un.value.trim().toLowerCase();
        if (!v) { hint.textContent = ''; return; }
        timer = setTimeout(async () => {
          try {
            const d = await api('/api/username-check?u=' + encodeURIComponent(v));
            if (!d.valid) { hint.className = 'hint err'; hint.textContent = '3–20 ta belgi: lotin harflari, raqam yoki _'; }
            else if (d.taken) { hint.className = 'hint err'; hint.textContent = 'Bu username band'; }
            else { hint.className = 'hint ok'; hint.textContent = 'Bu username bo\'sh ✓'; }
          } catch (e) {}
        }, 300);
      });
      const submit = async () => {
        try { const d = await api('/api/register', { firstName: fn.value, lastName: ln.value, username: un.value, password: p.value }); me = d.user; go('prompt'); route(); }
        catch (e) { fail(e.message); if (e.status === 409) { hint.className = 'hint err'; hint.textContent = 'Bu username band'; } }
      };
      box.append(h('label', {}, 'Ism'), fn, h('label', {}, 'Familya'), ln, h('label', {}, 'Username'), un, hint, h('label', {}, 'Parol'), p, sh,
        h('div', { style: 'margin-top:16px' }, h('button', { class: 'btn', onclick: submit }, 'Ro\'yxatdan o\'tish')), msg);
    }
  };
  draw();
  return h('div', {}, box);
}

/* ---------- Ideyalar (Pinterest uslubi) ---------- */
const GRADS = ['#6366f1,#8b5cf6', '#ec4899,#f43f5e', '#0ea5e9,#2563eb', '#10b981,#059669', '#f59e0b,#ef4444', '#14b8a6,#0891b2', '#a855f7,#d946ef', '#f97316,#e11d48'];
function viewIdeas() {
  const wrap = h('div', {});
  let cat = 'Hammasi', q = '';
  const chips = h('div', { class: 'chips' }), grid = h('div', { class: 'masonry' });
  const search = h('input', { placeholder: '🔍 Ideya qidirish...', style: 'max-width:340px;margin-bottom:14px' });
  const draw = () => {
    chips.replaceChildren(); grid.replaceChildren();
    const cats = ['Hammasi', ...new Set(ideasCache.map(i => i.category))];
    cats.forEach(c => chips.append(h('span', { class: 'chip' + (c === cat ? ' on' : ''), onclick: () => { cat = c; draw(); } }, c)));
    ideasCache.filter(i => (cat === 'Hammasi' || i.category === cat) && (i.title + ' ' + i.text).toLowerCase().includes(q))
      .forEach((i, idx) => {
        const tall = (i.title.length + i.text.length) % 3 === 0 ? 'padding-bottom:34px;' : '';
        grid.append(h('div', { class: 'idea', style: `background:linear-gradient(145deg,${GRADS[i.id % GRADS.length]});${tall}` },
          h('div', { class: 'em' }, i.emoji), h('div', { class: 'cat' }, i.category), h('h3', {}, i.title), h('p', {}, i.text),
          h('div', { class: 'acts' }, h('button', { onclick: () => { draft.topic = i.title; draft.service = /Slayd/.test(i.category) ? 'slayd' : /Maqola/.test(i.category) ? 'maqola' : 'referat'; go(me ? 'prompt' : 'auth'); } }, '✨ Prompt yaratish'))));
      });
    if (!grid.children.length) grid.append(h('p', { class: 'sub' }, 'Hech narsa topilmadi.'));
  };
  search.addEventListener('input', () => { q = search.value.trim().toLowerCase(); draw(); });
  wrap.append(h('h1', {}, 'Ideyalar makoni'), h('p', { class: 'sub' }, 'Referat, slayd, maqola va startap uchun g\'oyalar. Yoqqanini tanlang — prompt avtomatik tayyorlanadi.'), search, chips, grid);
  draw();
  return wrap;
}

/* ---------- Prompt yaratish ---------- */
function viewPrompt() {
  if (!me) return viewAuth();
  const wrap = h('div', {}), out = h('div', { class: 'result' }), msg = h('div', { class: 'msg' });
  const svcBox = h('div', { class: 'svc' });
  const topic = h('textarea', { placeholder: 'Nima haqida? Masalan: "Sun\'iy intellekt ta\'limda" yoki fan nomi va qo\'shimcha ma\'lumotlar' });
  const pages = h('input', { type: 'number', min: 1, max: 100, value: draft.pages });
  const lang = h('select', {}, h('option', { value: 'uz' }, 'O\'zbekcha'), h('option', { value: 'ru' }, 'Ruscha'), h('option', { value: 'en' }, 'Inglizcha'));
  const notes = h('textarea', { placeholder: 'Ixtiyoriy: o\'qituvchi talablari, kerakli manbalar, uslub va h.k.', style: 'min-height:70px' });
  const unitLbl = h('label', {}, ''), price = h('span', { class: 'pill' });
  topic.value = draft.topic; lang.value = draft.lang; notes.value = draft.notes;
  const cur = () => cfg.services.find(s => s.key === draft.service);
  const drawSvc = () => {
    svcBox.replaceChildren();
    cfg.services.forEach(s => svcBox.append(h('button', { class: s.key === draft.service ? 'on' : '', onclick: () => { draft.service = s.key; drawSvc(); } },
      h('b', {}, s.icon + ' ' + s.name), h('small', {}, 'Hajm: ' + s.unit), h('span', { class: 'pr' }, som(s.price)))));
    const s = cur(); unitLbl.textContent = 'Nechchi ' + s.unit + 'lik? (1–100)'; price.textContent = 'Narxi: ' + som(s.price);
  };
  const run = async (btn) => {
    msg.textContent = ''; out.replaceChildren(); btn.disabled = true;
    Object.assign(draft, { topic: topic.value, pages: pages.value, lang: lang.value, notes: notes.value });
    try {
      const d = await api('/api/generate', { service: draft.service, topic: topic.value, pages: pages.value, lang: lang.value, notes: notes.value });
      me.balance = d.balance; renderHeader(); showPrompt(out, d.prompt, d.chatgpt);
      out.scrollIntoView({ behavior: 'smooth' });
    } catch (e) {
      msg.className = 'msg err'; msg.textContent = e.message;
      if (e.status === 402) msg.append(' ', h('a', { href: '#balance', style: 'color:var(--brand)' }, 'Hisobni to\'ldirish →'));
      if (e.status === 401) { me = null; go('auth'); route(); }
    } finally { btn.disabled = false; }
  };
  const btn = h('button', { class: 'btn', onclick: () => run(btn) }, 'Prompt yaratish');
  wrap.append(h('h1', {}, 'ChatGPT uchun prompt'), h('p', { class: 'sub' }, 'Ma\'lumotni kiriting — biz to\'liq tayyor prompt yozib beramiz. Uni ChatGPT ga tashlaysiz.'),
    h('div', { class: 'card' }, h('label', { style: 'margin-top:0' }, 'Nimaga kerak?'), svcBox,
      h('label', {}, 'Nima haqida?'), topic,
      h('div', { class: 'row' }, h('div', {}, unitLbl, pages), h('div', {}, h('label', {}, 'Til'), lang)),
      h('label', {}, 'Qo\'shimcha talablar'), notes,
      h('div', { style: 'margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap' }, btn, price), msg), out);
  drawSvc();
  return wrap;
}
function showPrompt(out, text, link) {
  out.replaceChildren();
  const copy = h('button', { class: 'btn light', onclick: async () => { try { await navigator.clipboard.writeText(text); copy.textContent = '✓ Nusxalandi'; } catch (e) { const r = document.createRange(); r.selectNodeContents(pre); getSelection().removeAllRanges(); getSelection().addRange(r); copy.textContent = 'Belgilandi — Ctrl+C bosing'; } setTimeout(() => copy.textContent = '📋 Nusxalash', 2500); } }, '📋 Nusxalash');
  const pre = h('pre', { class: 'prompt' }, text);
  out.append(h('div', { class: 'card' }, h('h2', {}, '✅ Promptingiz tayyor'), pre,
    h('div', { style: 'margin-top:12px;display:flex;gap:10px;flex-wrap:wrap' }, copy, h('a', { class: 'btn', href: link, target: '_blank', rel: 'noopener', style: 'text-decoration:none' }, 'ChatGPT ga o\'tish ↗')),
    h('div', { class: 'steps' }, h('b', {}, 'Keyingi qadamlar:'), h('ol', { style: 'margin:6px 0 0 18px;padding:0' },
      h('li', {}, 'Yuqoridagi promptni nusxalang.'),
      h('li', {}, h('a', { href: link, target: '_blank', rel: 'noopener' }, 'chatgpt.com'), ' ga kiring va promptni xabar yozish joyiga qo\'ying (paste).'),
      h('li', {}, 'ChatGPT javob bergach, "davom et" deb yozib qolgan qismlarini oling.')))));
}

/* ---------- Hisobim ---------- */
function viewBalance() {
  if (!me) return viewAuth();
  const wrap = h('div', {}), hist = h('div', {});
  const tg = 'https://t.me/' + cfg.telegram;
  wrap.append(h('h1', {}, 'Hisobim'),
    h('div', { class: 'grid2' },
      h('div', { class: 'card' }, h('h2', {}, 'Balans'), h('div', { style: 'font-size:32px;font-weight:800;color:var(--brand)' }, me.role === 'admin' ? '—' : som(me.balance)),
        h('p', { class: 'sub', style: 'margin-top:8px' }, me.firstName + ' ' + me.lastName + ' · @' + me.username)),
      h('div', { class: 'card' }, h('h2', {}, '💳 Hisobni to\'ldirish'),
        h('ol', { style: 'margin:0 0 12px 18px;padding:0' },
          h('li', {}, 'Telegramda ', h('a', { href: tg, target: '_blank', rel: 'noopener', style: 'color:var(--brand);font-weight:700' }, '@' + cfg.telegram), ' ga yozing.'),
          h('li', {}, 'Saytdagi username\'ingizni ', h('b', {}, '@' + me.username), ' va to\'lov miqdorini ayting.'),
          h('li', {}, 'To\'lovni amalga oshiring va chekni yuboring.'),
          h('li', {}, 'Admin tekshirib, balansingizni to\'ldiradi.')),
        h('a', { class: 'btn', href: tg, target: '_blank', rel: 'noopener', style: 'text-decoration:none' }, 'Telegramda yozish ↗'))),
    h('div', { class: 'card', style: 'margin-top:16px' }, h('h2', {}, 'Tarix'), hist));
  api('/api/history').then(d => {
    const tb = h('table', {}, h('tr', {}, h('th', {}, 'Sana'), h('th', {}, 'Amal'), h('th', {}, 'Summa')));
    const rows = [...d.orders.map(o => ({ at: o.at, t: 'prompt', o })), ...d.topups.map(t => ({ at: t.at, t: 'topup', x: t }))].sort((a, b) => b.at - a.at);
    if (!rows.length) { hist.append(h('p', { class: 'sub' }, 'Hozircha hech narsa yo\'q.')); return; }
    rows.forEach(r => {
      if (r.t === 'topup') tb.append(h('tr', {}, h('td', {}, dt(r.at)), h('td', {}, 'Hisob to\'ldirildi'), h('td', { style: 'color:var(--ok);font-weight:700' }, (r.x.amount > 0 ? '+' : '') + som(r.x.amount))));
      else {
        const s = cfg.services.find(s => s.key === r.o.service);
        const det = h('details', {}, h('summary', {}, 'Promptni ko\'rish'), h('pre', { class: 'prompt', style: 'margin-top:8px' }, r.o.prompt));
        tb.append(h('tr', {}, h('td', {}, dt(r.at)), h('td', {}, (s ? s.name : r.o.service) + ': ' + r.o.topic + ' (' + r.o.pages + ')', det), h('td', { style: 'font-weight:700' }, '−' + som(r.o.price))));
      }
    });
    hist.append(tb);
  }).catch(() => {});
  return wrap;
}

/* ---------- Admin ---------- */
function viewAdmin() {
  if (!me || me.role !== 'admin') return h('div', { class: 'card narrow' }, 'Bu sahifa faqat admin uchun.');
  const wrap = h('div', {}), listBox = h('div', {}), msg = h('div', { class: 'msg' });
  let users = [], sel = null;
  const amount = h('input', { type: 'number', placeholder: 'Miqdor (so\'m). Xato bo\'lsa minus bilan', step: 1000 });
  const selLbl = h('div', { class: 'sub', style: 'margin:0 0 8px' }, 'Foydalanuvchini ro\'yxatdan tanlang');
  const find = h('input', { placeholder: '🔍 Ism yoki username bo\'yicha qidirish' });
  const topupsBox = h('div', {});
  const draw = () => {
    listBox.replaceChildren();
    const q = find.value.trim().toLowerCase();
    const tb = h('table', {}, h('tr', {}, h('th', {}, 'Ism familya'), h('th', {}, 'Username'), h('th', {}, 'Balans')));
    users.filter(u => (u.firstName + ' ' + u.lastName + ' ' + u.username).toLowerCase().includes(q)).forEach(u =>
      tb.append(h('tr', { class: 'pick' + (sel === u.username ? ' sel' : ''), onclick: () => { sel = u.username; selLbl.textContent = 'Tanlandi: @' + u.username + ' (' + u.firstName + ' ' + u.lastName + ')'; draw(); } },
        h('td', {}, u.firstName + ' ' + u.lastName), h('td', {}, '@' + u.username), h('td', {}, som(u.balance)))));
    listBox.append(users.length ? tb : h('p', { class: 'sub' }, 'Hali hech kim ro\'yxatdan o\'tmagan.'));
  };
  const load = async () => {
    const d = await api('/api/admin/users'); users = d.users; draw();
    topupsBox.replaceChildren(h('h2', {}, 'So\'nggi to\'ldirishlar'),
      d.topups.length ? h('table', {}, d.topups.map(t => h('tr', {}, h('td', {}, dt(t.at)), h('td', {}, '@' + t.username), h('td', { style: 'font-weight:700' }, (t.amount > 0 ? '+' : '') + som(t.amount))))) : h('p', { class: 'sub' }, 'Hozircha yo\'q.'));
  };
  const topup = async () => {
    if (!sel) { msg.className = 'msg err'; msg.textContent = 'Avval foydalanuvchini tanlang'; return; }
    try {
      const d = await api('/api/admin/topup', { username: sel, amount: amount.value });
      msg.className = 'msg ok'; msg.textContent = '@' + d.username + ' balansi: ' + som(d.balance); amount.value = ''; await load();
    } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
  };
  const ideaBox = h('div', { class: 'card', style: 'margin-top:16px' });
  const drawIdeas = async () => {
    const d = await api('/api/ideas'); ideasCache = d.ideas;
    const t = h('input', { placeholder: 'Ideya sarlavhasi' }), c = h('input', { placeholder: 'Kategoriya (masalan: Referat mavzulari)' }), e = h('input', { placeholder: 'Emoji', style: 'max-width:90px' }), x = h('input', { placeholder: 'Qisqa izoh' });
    const m2 = h('div', { class: 'msg' });
    ideaBox.replaceChildren(h('h2', {}, 'Ideyalarni boshqarish'),
      h('div', { class: 'row' }, t, c, e), h('div', { style: 'margin-top:10px' }, x),
      h('div', { style: 'margin:10px 0' }, h('button', { class: 'btn sm', onclick: async () => { try { await api('/api/admin/ideas', { title: t.value, category: c.value, emoji: e.value, text: x.value }); await drawIdeas(); } catch (er) { m2.className = 'msg err'; m2.textContent = er.message; } } }, 'Ideya qo\'shish'), m2),
      h('details', {}, h('summary', {}, 'Mavjud ideyalar (' + ideasCache.length + ')'),
        h('table', {}, ideasCache.map(i => h('tr', {}, h('td', {}, i.emoji + ' ' + i.title), h('td', {}, h('button', { class: 'btn red sm', onclick: async () => { if (confirm('O\'chirilsinmi?')) { await api('/api/admin/ideas/delete', { id: i.id }); drawIdeas(); } } }, 'O\'chirish')))))));
  };
  find.addEventListener('input', draw);
  wrap.append(h('h1', {}, 'Admin paneli'), h('p', { class: 'sub' }, 'Foydalanuvchini tanlang, to\'lagan miqdorini yozing va balansini to\'ldiring.'),
    h('div', { class: 'card' }, h('h2', {}, 'Foydalanuvchilar'), find, h('div', { style: 'margin-top:10px;max-height:340px;overflow:auto' }, listBox), h('div', { style: 'margin-top:14px' }, selLbl, amount,
      h('div', { style: 'margin-top:12px' }, h('button', { class: 'btn', onclick: topup }, 'Balansni to\'ldirish')), msg)),
    h('div', { class: 'card', style: 'margin-top:16px' }, topupsBox), ideaBox);
  load(); drawIdeas();
  return wrap;
}

/* ---------- Router ---------- */
function route() {
  renderHeader();
  const p = (location.hash || '#ideas').slice(1);
  const views = { ideas: viewIdeas, prompt: viewPrompt, balance: viewBalance, admin: viewAdmin, auth: () => me ? (go('prompt'), viewPrompt()) : viewAuth() };
  app.replaceChildren((views[p] || viewIdeas)());
  scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
$('#logo').addEventListener('click', () => go('ideas'));
(async () => {
  try {
    [cfg, me, ideasCache] = await Promise.all([api('/api/config'), api('/api/me').then(d => d.user), api('/api/ideas').then(d => d.ideas)]);
  } catch (e) { app.textContent = 'Serverga ulanib bo\'lmadi.'; return; }
  route();
})();
</script>
</body>
</html>
